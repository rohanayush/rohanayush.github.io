<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hand-drawn plant cell diagram">
  <rect width="320" height="180" fill="#f4e8cf"/>
  <g fill="none" stroke="#5e3d22" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- cell wall -->
    <rect x="46" y="34" width="228" height="112" rx="26" fill="#dff0e4" fill-opacity="0.5"/>
    <!-- cell membrane -->
    <rect x="56" y="44" width="208" height="92" rx="20"/>
    <!-- nucleus -->
    <circle cx="118" cy="90" r="26" fill="#e7b3c4" fill-opacity="0.5"/>
    <circle cx="118" cy="90" r="9" fill="#5e3d22" fill-opacity="0.25" stroke="none"/>
    <!-- vacuole -->
    <ellipse cx="206" cy="92" rx="40" ry="30" fill="#bcd9ef" fill-opacity="0.45"/>
    <!-- chloroplasts -->
    <g fill="#9fce9c" fill-opacity="0.7" stroke-width="1.8">
      <ellipse cx="160" cy="58" rx="13" ry="7" transform="rotate(24 160 58)"/>
      <ellipse cx="150" cy="124" rx="13" ry="7" transform="rotate(-18 150 124)"/>
      <ellipse cx="92" cy="126" rx="12" ry="6" transform="rotate(12 92 126)"/>
    </g>
  </g>
</svg>
